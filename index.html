<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TerraPulse - Global Hazard Tracker</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">

  <!-- External Leaflet CSS & Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Map Canvas Container -->
  <div id="map"></div>

  <!-- Header Navigation Controls Overlay -->
  <header class="app-header">
    <div class="logo">🌐 TerraPulse</div>
    <div class="view-controls">
      <button id="btn-global" class="active">🌍 Global</button>
      <button id="btn-local">📍 Near Me</button>
    </div>
  </header>

  <!-- Layer Selection Panel Overlay -->
  <div class="layer-panel">
    <h3>Active Hazard Layers</h3>
    <label class="toggle-row">
      <span>🔴 Earthquakes (M4.5+)</span>
      <input type="checkbox" id="toggle-quakes" checked />
    </label>
    <label class="toggle-row">
      <span>🌋 Active Volcanoes</span>
      <input type="checkbox" id="toggle-volcanoes" checked />
    </label>
    <label class="toggle-row">
      <span>🔥 Wildfires (NASA EONET)</span>
      <input type="checkbox" id="toggle-fires" checked />
    </label>
  </div>

  <!-- Leaflet & Clustering Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.js"></script>

  <!-- Application Engine Script -->
  <script src="app.js"></script>
</body>
</html>
